name: AgentCy
options:
  bundleIdPrefix: com.agentcy
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "114"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Design tokens are programmatic so simulator/source builds and the asset
    # catalog share one semantic API without generated Color redeclarations.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
configs:
  Debug: debug
  Release: release
targets:
  AgentCy:
    type: application
    platform: iOS
    sources:
      - path: AgentCy
        excludes:
          - Support/AgentCy.entitlements
      - path: AgentCyShared
    dependencies:
      - target: AgentCyWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentcy.app
        PRODUCT_NAME: agent.cy
        PRODUCT_MODULE_NAME: AgentCy
        DEVELOPMENT_TEAM: 2S27MSM8G8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AgentCy/Support/AgentCy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: agent.cy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      configs:
        Debug:
          AGENTCY_API_BASE_URL: "https://agentcy-production.up.railway.app"
          AGENTCY_USE_LIVE_AI: YES
          AGENTCY_CLOUDKIT_ENABLED: NO
        Release:
          AGENTCY_API_BASE_URL: "https://agentcy-production.up.railway.app"
          AGENTCY_USE_LIVE_AI: YES
          AGENTCY_CLOUDKIT_ENABLED: YES
    info:
      path: AgentCy/Support/Info.plist
      properties:
        CFBundleDisplayName: agent.cy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - InterVariable.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.agentcy.app
            CFBundleURLSchemes:
              - agentcy
        AGENTCY_API_BASE_URL: "$(AGENTCY_API_BASE_URL)"
        AGENTCY_USE_LIVE_AI: "$(AGENTCY_USE_LIVE_AI)"
        AGENTCY_CLOUDKIT_ENABLED: "$(AGENTCY_CLOUDKIT_ENABLED)"
        UIBackgroundModes:
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCalendarsFullAccessUsageDescription: "Allow agent.cy to add scheduled posts and production tasks to your chosen calendar."
    entitlements:
      path: AgentCy/Support/AgentCy.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.agentcy.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.agentcy.app
  AgentCyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentCyWidgets
      - path: AgentCyShared
      - path: AgentCy/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentcy.app.widgets
        PRODUCT_NAME: agent.cy Widgets
        PRODUCT_MODULE_NAME: AgentCyWidgets
        DEVELOPMENT_TEAM: 2S27MSM8G8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AgentCyWidgets/AgentCyWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: AgentCyWidgets/Info.plist
      properties:
        CFBundleDisplayName: agent.cy Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - InterVariable.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    entitlements:
      path: AgentCyWidgets/AgentCyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.agentcy.app
  AgentCyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgentCyTests
    dependencies:
      - target: AgentCy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentcy.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/agent.cy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/agent.cy"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AgentCy:
    build:
      targets:
        AgentCy: all
        AgentCyWidgets: all
        AgentCyTests: [test]
    test:
      targets:
        - AgentCyTests
      gatherCoverageData: true
