name: AgentCy
options:
  bundleIdPrefix: com.agentcy
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "227"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Design tokens are programmatic so simulator/source builds and the asset
    # catalog share one semantic API without generated Color redeclarations.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
configs:
  Debug: debug
  Release: release
targets:
  AgentCy:
    type: application
    platform: iOS
    sources:
      - path: AgentCy
        excludes:
          - Support/AgentCy.entitlements
      - path: AgentCyShared
    dependencies:
      - target: AgentCyWidgets
        embed: true
      - target: AgentCyInspirationShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentcy.app
        PRODUCT_NAME: agent.cy
        PRODUCT_MODULE_NAME: AgentCy
        DEVELOPMENT_TEAM: 2S27MSM8G8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AgentCy/Support/AgentCy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: agent.cy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: AgentCy Development 2026
          APS_ENVIRONMENT: development
          AGENTCY_API_BASE_URL: "https://agentcy-production.up.railway.app"
          AGENTCY_USE_LIVE_AI: YES
          AGENTCY_CLOUDKIT_ENABLED: YES
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: AgentCy Development 2026
          APS_ENVIRONMENT: development
          AGENTCY_API_BASE_URL: "https://agentcy-production.up.railway.app"
          AGENTCY_USE_LIVE_AI: YES
          AGENTCY_CLOUDKIT_ENABLED: YES
    info:
      path: AgentCy/Support/Info.plist
      properties:
        CFBundleDisplayName: agent.cy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - InterVariable.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.agentcy.app
            CFBundleURLSchemes:
              - agentcy
        AGENTCY_API_BASE_URL: "$(AGENTCY_API_BASE_URL)"
        AGENTCY_USE_LIVE_AI: "$(AGENTCY_USE_LIVE_AI)"
        AGENTCY_CLOUDKIT_ENABLED: "$(AGENTCY_CLOUDKIT_ENABLED)"
        # Required by private CloudKit mirroring. Notification content remains local-only.
        UIBackgroundModes:
          - audio
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Allow agent.cy to reach Local Cy on your Mac while both devices are on the same network."
        NSCalendarsFullAccessUsageDescription: "Allow agent.cy to add scheduled posts and tasks to your chosen calendar."
        NSMicrophoneUsageDescription: "Allow agent.cy to record a Voice Spark that you choose to save as an editable idea."
        NSSpeechRecognitionUsageDescription: "Allow agent.cy to turn Voice Spark recordings into editable thoughts you can save, replay, and connect to your content."
        NSSupportsLiveActivities: true
    entitlements:
      path: AgentCy/Support/AgentCy.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.agentcy.shared"
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.agentcy.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.agentcy.app
        aps-environment: "$(APS_ENVIRONMENT)"
  AgentCyMac:
    type: application
    supportedDestinations:
      - macCatalyst
    deploymentTarget:
      iOS: "26.0"
    sources:
      - path: AgentCy
        excludes:
          - Support/AgentCy.entitlements
      - path: AgentCyShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentcy.app
        PRODUCT_NAME: agent.cy
        PRODUCT_MODULE_NAME: AgentCy
        DEVELOPMENT_TEAM: 2S27MSM8G8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AgentCyMac/AgentCyMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        INFOPLIST_KEY_CFBundleDisplayName: agent.cy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: AgentCy Mac Catalyst Development 2026
          APS_ENVIRONMENT: development
          AGENTCY_API_BASE_URL: "https://agentcy-production.up.railway.app"
          AGENTCY_USE_LIVE_AI: YES
          AGENTCY_CLOUDKIT_ENABLED: YES
        Release:
          APS_ENVIRONMENT: production
          AGENTCY_API_BASE_URL: "https://agentcy-production.up.railway.app"
          AGENTCY_USE_LIVE_AI: YES
          AGENTCY_CLOUDKIT_ENABLED: YES
    info:
      path: AgentCyMac/Info.plist
      properties:
        CFBundleDisplayName: agent.cy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSPrefersDisplaySafeAreaCompatibilityMode: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - InterVariable.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.agentcy.app
            CFBundleURLSchemes:
              - agentcy
        AGENTCY_API_BASE_URL: "$(AGENTCY_API_BASE_URL)"
        AGENTCY_USE_LIVE_AI: "$(AGENTCY_USE_LIVE_AI)"
        AGENTCY_CLOUDKIT_ENABLED: "$(AGENTCY_CLOUDKIT_ENABLED)"
        UIBackgroundModes:
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Allow agent.cy to reach Local Cy on this Mac."
        NSCalendarsFullAccessUsageDescription: "Allow agent.cy to add scheduled posts and tasks to your chosen calendar."
        NSSpeechRecognitionUsageDescription: "Allow agent.cy to transcribe audio from a video you explicitly share so it can create an editable post idea."
    entitlements:
      path: AgentCyMac/AgentCyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.calendars: true
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.agentcy.shared"
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.agentcy.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.agentcy.app
        aps-environment: "$(APS_ENVIRONMENT)"
  AgentCyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentCyWidgets
      - path: AgentCyShared
      - path: AgentCy/Resources/Fonts
        buildPhase: resources
      # Live Activities use the same licensed Nucleo assets as the app so
      # system surfaces never fall back to an SF Symbol for app actions.
      - path: AgentCy/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentcy.app.widgets
        PRODUCT_NAME: agent.cy Widgets
        PRODUCT_MODULE_NAME: AgentCyWidgets
        DEVELOPMENT_TEAM: 2S27MSM8G8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AgentCyWidgets/AgentCyWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: AgentCy Widgets Development 2026
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: AgentCy Widgets Development 2026
    info:
      path: AgentCyWidgets/Info.plist
      properties:
        CFBundleDisplayName: agent.cy Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - InterVariable.ttf
    entitlements:
      path: AgentCyWidgets/AgentCyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.agentcy.app
  AgentCyInspirationShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentCyInspirationShare
      - path: AgentCyShared/InspirationShareTransport.swift
      - path: AgentCyShared/InspirationShareBridge.swift
      - path: AgentCyShared/AgentOKLCH.swift
      - path: AgentCy/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentcy.app.inspiration-share
        PRODUCT_NAME: agent.cy
        PRODUCT_MODULE_NAME: AgentCyInspirationShare
        DEVELOPMENT_TEAM: 2S27MSM8G8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AgentCyInspirationShare/AgentCyInspirationShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: agent.cy
      configs:
        Debug:
          AGENTCY_API_BASE_URL: "https://agentcy-production.up.railway.app"
        Release:
          AGENTCY_API_BASE_URL: "https://agentcy-production.up.railway.app"
    info:
      path: AgentCyInspirationShare/Info.plist
      properties:
        CFBundleDisplayName: agent.cy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - InterVariable.ttf
        AGENTCY_API_BASE_URL: "$(AGENTCY_API_BASE_URL)"
        NSSpeechRecognitionUsageDescription: "Allow agent.cy to transcribe audio from a video you explicitly share so it can create an editable post idea."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationUsesStrictMatching: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: AgentCyInspirationShare/AgentCyInspirationShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.agentcy.app
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.agentcy.shared"
  AgentCyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgentCyTests
    dependencies:
      - target: AgentCy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentcy.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/agent.cy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/agent.cy"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AgentCy:
    build:
      targets:
        AgentCy: all
        AgentCyWidgets: all
        AgentCyInspirationShare: all
        AgentCyTests: [test]
    test:
      targets:
        - AgentCyTests
      gatherCoverageData: true
  AgentCy Desktop:
    build:
      targets:
        AgentCyMac: all
    run:
      config: Debug
    archive:
      config: Release
