name: Package Claude & Codex bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import Apple signing identity
        env:
          CERTIFICATE_P12: ${{ secrets.AGENTCY_MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.AGENTCY_MAC_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_P12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/agentcy.p12"
          security create-keychain -p runner "$RUNNER_TEMP/agentcy.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/agentcy.keychain-db"
          security unlock-keychain -p runner "$RUNNER_TEMP/agentcy.keychain-db"
          security import "$RUNNER_TEMP/agentcy.p12" -k "$RUNNER_TEMP/agentcy.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$RUNNER_TEMP/agentcy.keychain-db"
      - name: Build signed macOS wizard
        env:
          AGENTCY_MAC_SIGN_IDENTITY: ${{ secrets.AGENTCY_MAC_SIGN_IDENTITY }}
        run: pnpm mcp:package
      - name: Archive and notarize
        env:
          APPLE_ID: ${{ secrets.AGENTCY_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.AGENTCY_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.AGENTCY_NOTARY_APP_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          ARCH="$(node -p 'process.arch')"
          ditto -c -k --keepParent "mcp/artifacts/darwin-$ARCH" agentcy-macos.zip
          xcrun notarytool submit agentcy-macos.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
      - uses: actions/upload-artifact@v4
        with:
          name: agentcy-macos
          path: agentcy-macos.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Windows wizard
        run: pnpm mcp:package
      - name: Import and apply Windows signature
        shell: pwsh
        env:
          CERTIFICATE_PFX: ${{ secrets.AGENTCY_WINDOWS_CERTIFICATE_PFX }}
          CERTIFICATE_PASSWORD: ${{ secrets.AGENTCY_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PFX)) { throw "Windows signing certificate is required" }
          $pfx = Join-Path $env:RUNNER_TEMP "agentcy.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_PFX))
          $secure = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Get-ChildItem mcp\artifacts\win32-x64\*.exe | ForEach-Object {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $cert.Thumbprint $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          }
          Compress-Archive -Path mcp\artifacts\win32-x64\* -DestinationPath agentcy-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agentcy-windows
          path: agentcy-windows.zip
          if-no-files-found: error
