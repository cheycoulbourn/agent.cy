name: Package Claude & Codex bridge

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: agentcy-bridge-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm --filter @agent-cy/contracts build
      - name: Import Apple signing identity
        env:
          CERTIFICATE_P12: ${{ secrets.AGENTCY_MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.AGENTCY_MAC_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_P12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/agentcy.p12"
          security create-keychain -p runner "$RUNNER_TEMP/agentcy.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/agentcy.keychain-db"
          security unlock-keychain -p runner "$RUNNER_TEMP/agentcy.keychain-db"
          security import "$RUNNER_TEMP/agentcy.p12" -k "$RUNNER_TEMP/agentcy.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$RUNNER_TEMP/agentcy.keychain-db"
      - name: Build signed macOS wizard
        env:
          AGENTCY_MAC_SIGN_IDENTITY: ${{ secrets.AGENTCY_MAC_SIGN_IDENTITY }}
        run: pnpm mcp:package
      - name: Archive and notarize
        env:
          APPLE_ID: ${{ secrets.AGENTCY_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.AGENTCY_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.AGENTCY_NOTARY_APP_PASSWORD }}
        run: |
          test -n "$APPLE_ID"
          ARCH="$(node -p 'process.arch')"
          ditto -c -k --keepParent "mcp/artifacts/darwin-$ARCH" agentcy-macos.zip
          xcrun notarytool submit agentcy-macos.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
      - uses: actions/upload-artifact@v4
        with:
          name: agentcy-macos
          path: agentcy-macos.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum agentcy-macos.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "agent.cy Claude & Codex bridge $RELEASE_TAG" \
            --generate-notes \
            --latest \
            release-artifacts/agentcy-macos.zip \
            release-artifacts/SHA256SUMS.txt
